name: OIDC Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  # Lets the job request a token
  # Does not grant any write access to the repo
  id-token: write
  contents: read

jobs:
  oidc-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-1
      - name: Verify identity
        run: aws sts get-caller-identity